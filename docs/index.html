<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ETX Agentic AI</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="ETX Agentic AI Lab Guide">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests; frame-src https:; default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data:">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    .markdown-section pre,
    .markdown-section pre > code {
      white-space: pre-wrap !important;
      overflow-wrap: break-word !important;
    }
  </style>
</head>
<body>
  <div class="top-navigation">
  </div>

  <div class="user-name-form">
      <div class="user-inputs">
        <label for="uname">User Name</label><br/>
        <input type="text" id="uname" name="username" placeholder="Your username..">
      </div>

      <div class="user-inputs">
        <label for="pass">Password</label><br/>
        <input type="text" id="pass" name="password" placeholder="Your password">
      </div>

      <div class="user-inputs">
        <label for="cdomain">Cluster Domain</label><br/>
        <input type="text" id="cdomain" name="clusterdomain" placeholder="apps.cluster.example.com">
      </div>

      <div class="" style="margin-left: 30px;">
        <button class="storage-btns" onclick="setNamesInStorage()">Save</button>
        <button class="storage-btns" onclick="clearStorage()">Clear</button>

        <div class="dropdown">
          <button class="storage-btns" style="background-color: #049fd9; color: white; border: 2px #049fd9;">Quick Links</button>
          <div class="dropdown-content" id="dynamic-links">
          </div>
        </div>
      </div>
  </div>

  <div id="app"></div>

  <script>
    document.getElementById("uname").value = localStorage.getItem('USER_NAME') ? localStorage.getItem('USER_NAME') : '';
    document.getElementById("pass").value = localStorage.getItem('PASSWORD') ? localStorage.getItem('PASSWORD') : '';
    document.getElementById("cdomain").value = localStorage.getItem('CLUSTER_DOMAIN') ? localStorage.getItem('CLUSTER_DOMAIN') : '';

    function populateDropdownLinks() {
      const clusterDomain = localStorage.getItem('CLUSTER_DOMAIN') ? localStorage.getItem('CLUSTER_DOMAIN') : '<CLUSTER_DOMAIN>';
      const username = localStorage.getItem('USER_NAME') ? localStorage.getItem('USER_NAME') : '<USER_NAME>';
      const linksContainer = document.getElementById('dynamic-links');
      if (!linksContainer) return;

      linksContainer.innerHTML = '';

      const links = [
        { name: '📺 OpenShift Console', url: `https://console-openshift-console.${clusterDomain}` },
        { name: '🦙 Llama Stack Playground', url: `https://${username}-llama-stack-playground.${clusterDomain}` },
        { name: '🐙 Argo CD', url: `https://argocd-server-${username}-ai-agent.${clusterDomain}` }
      ];

      links.forEach(link => {
        const a = document.createElement('a');
        a.href = link.url;
        a.textContent = link.name;
        a.target = '_blank';
        linksContainer.appendChild(a);
      });
    }

    document.addEventListener('DOMContentLoaded', populateDropdownLinks);

    function setNamesInStorage () {
      let uname = document.getElementById('uname').value.toLowerCase();
      let pass = document.getElementById('pass').value;
      let cdomain = (document.getElementById('cdomain').value.toLowerCase().indexOf('https://') > -1)
                    ? document.getElementById('cdomain').value.toLowerCase().substring(8).replace(/[\/,&,?]/g, "")
                    : document.getElementById('cdomain').value.toLowerCase().replace(/[\/,&,?]/g, "");

      if (uname == '') {
        alert('Please enter a username');
        return;
      }
      if (pass == '') {
        alert('Please enter your password');
        return;
      }
      if (cdomain == '') {
        alert('Please enter a cluster domain');
        return;
      }

      console.info('INFO - setting user, cluster to :', uname, pass, cdomain);
      localStorage.setItem('USER_NAME', uname);
      localStorage.setItem('PASSWORD', pass);
      localStorage.setItem('CLUSTER_DOMAIN', cdomain);
      location.reload();
      populateDropdownLinks();
    }

    function clearStorage () {
      console.info('INFO - clearing user and cluster');
      localStorage.removeItem('USER_NAME');
      localStorage.removeItem('PASSWORD');
      localStorage.removeItem('CLUSTER_DOMAIN');
      document.getElementById('uname').value = '';
      document.getElementById('pass').value = '';
      document.getElementById('cdomain').value = '';
      location.reload();
      populateDropdownLinks();
    }

    window.$docsify = {
      auto2top: true,
      executeScript: true,
      name: 'ETX Agentic AI Lab',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 0,
      sidebarDisplayLevel: 0,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      copyCode: {
        buttonText : '✂️',
        errorText  : '😔',
        successText: '💚 copied'
      },
      pagination: {
        crossChapter: true
      },
      plugins: [
        function(hook) {
          hook.beforeEach(function(content) {
            const userName = localStorage.getItem('USER_NAME') ? localStorage.getItem('USER_NAME') : '<USER_NAME>';
            const passWord = localStorage.getItem('PASSWORD') ? localStorage.getItem('PASSWORD') : '<PASSWORD>';
            const clusterDomain = localStorage.getItem('CLUSTER_DOMAIN') ? localStorage.getItem('CLUSTER_DOMAIN') : '<CLUSTER_DOMAIN>';

            // Derive the API endpoint from the apps domain (strip leading "apps." to get base domain)
            var baseDomain = clusterDomain;
            if (baseDomain.startsWith('apps.')) {
              baseDomain = baseDomain.substring(5);
            }
            const loginCommand = 'oc login --insecure-skip-tls-verify=false -u ' + userName + ' -p ' + passWord + ' https://api.' + baseDomain + ':6443';

            return content.replaceAll('<USER_NAME>', userName)
                    .replaceAll('<PASSWORD>', passWord)
                    .replaceAll('<CLUSTER_DOMAIN>', clusterDomain)
                    .replaceAll('<LOGIN_COMMAND>', loginCommand);
          });

          const footer = `<hr/>
            <footer>
            <span><a href="https://github.com/cisco"> ETX Agentic AI Showroom</a></span>
            </footer>
            `;

          hook.afterEach(function(html) {
            return html + footer;
          });
        }
      ],
      search: 'auto',
      vueComponents: { }
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//unpkg.com/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//unpkg.com/prismjs/components/prism-bash.min.js"></script>
  <script src="//unpkg.com/prismjs/components/prism-yaml.min.js"></script>
  <script src="//unpkg.com/prismjs/components/prism-python.min.js"></script>
  <script src="//unpkg.com/prismjs/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-prism@latest/dist/docsify-prism.min.js"></script>
  <style>
    input[type=text] {
      padding: 8px 12px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    input[type=text]:focus {
      outline: none !important;
      border: 2px solid #049fd9;
    }
    .user-name-form {
      margin-left: 7%;
      background-color: #f3f3f3;
      padding-left: 20%;
      padding-right: 20%;
      padding-top: 10px;
      padding-bottom: 10px;
      display: flex;
      align-items: center;
    }
    .user-inputs {
      flex: 1;
      margin-right: 20px;
    }
    .user-inputs:input,label {
      font-size: 12px;
      display: block;
    }
    .storage-btns {
      font-size: 12px;
      margin: 10px;
      padding: 10px;
      cursor: pointer;
      background-color: #b3e0f2;
      color: black;
      border: 2px solid #b3e0f2;
      width: 130px;
      text-align: center;
    }
    p.tip {
      border-left-color: #4D4D4D;
    }
    p.tip:before {
      content: "!";
      background-color: #4D4D4D;
    }
    .sidebar {
       background-color: #f3f3f3;
    }
    .top-navigation {
      position: absolute;
      top: 40px;
      right: 100px;
      z-index: 100;
    }
    .dropbtn {
      background-color: #049fd9;
      color: white;
      padding: 10px 30px;
      font-size: 13px;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
    .dropdown {
      position: relative;
      display: inline-block;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      background-color: #f9f9f9;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
      border-radius: 4px;
    }
    .dropdown-content a {
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      font-size: 14px;
    }
    .dropdown-content a:hover {background-color: #f1f1f1;}
    .dropdown:hover .dropdown-content {display: block;}
    .dropdown:hover .dropbtn {background-color: #037daa;}

    :root {
      --base-font-size: 14px;
      --base-font-family: "RedHatText",Overpass,"Open Sans",Helvetica,Arial,sans-serif;
      --theme-color: #049fd9;
      --content-max-width: 75em;
      --sidebar-width: 19rem;
      --sidebar-nav-pagelink-background-image             : ;
      --sidebar-nav-pagelink-background-image--active     : ;
      --sidebar-nav-pagelink-background-image--collapse   : ;
      --sidebar-nav-pagelink-background-image--loaded     : ;
    }
  </style>
</body>
</html>
